{% extends "tabs.html" %}

{% set active = "delete" %}

{% block head %}
<title>Delete Resource | Backend Development & System Design</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="language" content="English">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}

{% block tab_content %}
<form id="delete-form" method="delete" action="/api/components/upload/del">
  <div
    class="bg-gray-800 p-6 rounded-lg border border-[#44475a] space-y-6 font-[JetBrains_Mono] hover:shadow-md transition">
    <h2 class="text-xl font-[JetBrains_Mono] text-gray-100 mb-6">
      <span class="text-[#ff79c6]">async</span> <span class="text-[#ff79c6]">fn</span> <span
        class="text-[#50fa7b]">delete</span><span class="text-green-400">()</span><span class="hidden sm:inline"> <span
          class="text-gray-300">-&gt;</span> <span class="text-[#50fa7b]">Result</span><span
          class="text-green-400">&lt;</span><span class="text-green-400">()</span><span class="text-gray-300">,</span>
        <span class="text-gray-300">AppError</span><span class="text-green-400">&gt;</span>
      </span>
    </h2>

    <!-- Key Input -->
    <div>
      <label for="key" class="block mb-1 text-sm text-gray-300">
        <span class="text-[#ff79c6]/80">key</span>: <span class="text-[#50fa7b]/80">String</span>
      </label>
      <input type="text" id="key" name="key" placeholder="bucket/folder1/folder2/payload"
        class="w-full px-3 py-2 bg-gray-700 border border-[#44475a] rounded-md text-gray-300 focus:outline-none focus:ring-1 focus:ring-[#50fa7b] font-[JetBrains_Mono]"
        required>
    </div>

    <!-- Admin Password -->
    <div>
      <label for="password" class="block mb-1 text-sm text-gray-300">
        <span class="text-[#ff79c6]/80">admin_password</span>: <span class="text-[#50fa7b]/80">String</span>
      </label>
      <input type="password" id="password" name="password" placeholder="hunter2"
        class="w-full px-3 py-2 bg-gray-700 border border-[#44475a] rounded-md text-gray-300 focus:outline-none focus:ring-1 focus:ring-[#50fa7b] font-[JetBrains_Mono]"
        required>
    </div>

    <!-- Cloudflare Turnstile -->
    <div class="cf-turnstile" data-sitekey="{{ &crate::config::ENV.turnstile_site_key }}" data-callback="onSubmit"
      data-size="invisible">
    </div>

    <!-- Submit Button -->
    <div class="flex justify-end group">
      <button type="submit" hx-trigger="click" hx-post="/api/components/upload/del" hx-target="#del-status"
        hx-swap="innerHTML" hx-disabled-elt="this" hx-indicator="#spinner"
        class="px-4 py-2 bg-[#44475a] text-gray-300 font-medium rounded-md transition font-[JetBrains_Mono]">
        <span
          class="button-text text-[#50fa7b]/80">delete</span><span class="text-gray-300">(<i id="spinner" class="htmx-indicator fa-solid fa-spinner animate-spin"></i>)</span>
      </button>
    </div>

    <!-- Status Area -->
    <div id="del-status" class="mt-6"></div>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script type="module" src="/assets/js/upload/general.js"></script>
{% endblock %}

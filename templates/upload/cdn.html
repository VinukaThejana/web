{% extends "tabs.html" %}

{% block head %}
<title>Add to CDN | Backend Development &amp; System Design </title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="language" content="English">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}

{% block tab_content %}
<form id="upload-form">
  <div class="bg-gray-800 p-4 sm:p-6 rounded-lg border border-[#44475a] space-y-6 font-[JetBrains_Mono]">

    <!-- Drop Zone -->
    <div id="dropzone" class="border-2 border-dashed border-[#6272a4] bg-gray-900 rounded-md p-6 text-center cursor-pointer hover:border-green-400 transition">
      <p class="text-gray-400 mb-2 text-sm sm:text-base">Drag & drop your file here, or click to select</p>
      <input type="file" id="file-input" name="file" accept="*" class="hidden" required>
      <p id="file-name" class="text-green-400 mt-2 text-sm"></p>
    </div>

    <!-- File Path -->
    <div>
      <label for="path" class="block mb-1 text-sm text-gray-300">
        <span class="text-[#ff79c6]/80">path</span>: <span class="text-[#50fa7b]/80">&str</span>
      </label>
      <input type="text" id="path" name="path" placeholder="bucket/folder1/folder2/image.ext"
        class="w-full px-3 py-2 bg-gray-700 border border-[#44475a] rounded-md text-gray-300 focus:outline-none focus:ring-1 focus:ring-green-400" required>
    </div>

    <!-- Admin Password -->
    <div>
      <label for="password" class="block mb-1 text-sm text-gray-300">
        <span class="text-[#ff79c6]/80">admin_password</span>: <span class="text-[#50fa7b]/80">&str</span>
      </label>
      <input type="password" id="password" name="password" placeholder="hunter2"
        class="w-full px-3 py-2 bg-gray-700 border border-[#44475a] rounded-md text-gray-300 focus:outline-none focus:ring-1 focus:ring-green-400" required>
    </div>

    <div
      class="cf-turnstile"
      data-sitekey="{{ &crate::config::ENV.turnstile_site_key }}"
      data-callback="onSubmit"
      data-size="invisible">
    </div>

    <!-- Upload Button -->
    <div class="flex justify-end sm:justify-between items-center flex-col sm:flex-row gap-3">
      <div id="upload-status" class="text-sm text-gray-400 capitalize"></div>
      <button id="upload-button" type="submit" class="w-full sm:w-auto px-4 py-2 bg-[#44475a] text-gray-300 font-medium rounded-md transition font-[JetBrains_Mono]">
        <span class="text-[#50fa7b]/80">upload_file</span>()
      </button>
    </div>
  </div>
</form>

<div id="url-section" class="bg-gray-800 p-4 rounded-md border border-[#44475a] text-sm text-gray-300 mt-4 hidden">
  <div class="flex items-center gap-2">
    <input id="url-input" type="text" readonly value="https://cdn.example.com/yourfile.png"
      class="w-full px-3 py-2 bg-gray-700 border border-[#44475a] rounded-md text-gray-300 focus:outline-none focus:ring-1 focus:ring-green-400">
    <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)"
      class="w-full sm:w-auto px-4 py-2 bg-[#44475a] hover:bg-green-400 text-gray-300 hover:text-[#ff79c6]/80 font-medium rounded-md transition font-[JetBrains_Mono]">
      Copy
    </button>
  </div>
</div>
{% endblock %}


{% block scripts %}
<script type="module" src="/assets/js/upload/general.js"></script>
<script type="module" src="/assets/js/upload/cdn.js"></script>
{% endblock %}

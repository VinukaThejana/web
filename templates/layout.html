<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" sizes="57x57" href="/assets/icons/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/assets/icons/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/assets/icons/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/assets/icons/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/assets/icons/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/icons/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/assets/icons/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-icon-180x180.png">
  <link rel="apple-touch-icon-precomposed" href="/assets/icons/apple-icon-precomposed.png">

  <!-- Android Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="144x144" href="/assets/icons/android-icon-144x144.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/android-icon-96x96.png">
  <link rel="icon" type="image/png" sizes="72x72" href="/assets/icons/android-icon-72x72.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/android-icon-48x48.png">
  <link rel="icon" type="image/png" sizes="36x36" href="/assets/icons/android-icon-36x36.png">

  <!-- Windows/Microsoft Icons -->
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="/assets/icons/ms-icon-144x144.png">
  <meta name="msapplication-config" content="/assets/icons/browserconfig.xml">

  <!-- Other Favicon Formats -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">

  <!-- Web Manifest -->
  <link rel="manifest" href="/assets/icons/manifest.json">

  <script src="/assets/js/tailwind.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"
    integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
    crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
    rel="stylesheet">

  <style type="text/tailwindcss">
    html {
      font-family: 'Roboto Flex', ui-sans-serif, system-ui, sans-serif;
    }
  </style>
  {% block head %}{% endblock %}
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <div class="container mx-auto px-4 max-w-3xl flex-grow">
    <!-- Navigation -->
    <nav class="py-6 flex justify-center">
      <div class="flex space-x-8 text-sm">
        <a href="/" class="hover:text-green-400 transition">Home</a>
        <a href="/projects" class="hover:text-green-400 transition">Projects</a>
        <a href="/about" class="hover:text-green-400 transition">About</a>
      </div>
    </nav>

    {% block content %}
    {% endblock %}
  </div>

  <!-- Footer -->
  <footer class="py-8 text-center text-sm text-gray-400">
    <div class="mb-2">
      <a href="#" class="hover:text-green-400 transition mx-2"></a>
    </div>
    <div>
      © 2025 <a href="/" class="hover:text-green-400 transition">{{ crate::util::AUTHOR }}</a>. All rights reserved.
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>

</html>

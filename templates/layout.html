<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}{{ title }} | {{ crate::util::AUTHOR }} {% endblock %}</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <script src="/assets/js/tailwind.min.js"></script>

  <script src="https://unpkg.com/htmx.org@2.0.4"
    integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
    crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    html {
      font-family: 'Roboto Flex', ui-sans-serif, system-ui, sans-serif;
    }
  </style>
  {% block head %}{% endblock %}
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <div class="container mx-auto px-4 max-w-3xl flex-grow">
    <!-- Navigation -->
    <nav class="py-6 flex justify-center">
      <div class="flex space-x-8 text-sm">
        <a href="#" class="hover:text-green-400 transition">Home</a>
        <a href="#" class="hover:text-green-400 transition">Newsletters</a>
        <a href="#" class="hover:text-green-400 transition">Projects</a>
        <a href="#" class="hover:text-green-400 transition">About</a>
      </div>
    </nav>

    {% block content %}
    {% endblock %}
  </div>

  <!-- Footer -->
  <footer class="py-8 text-center text-sm text-gray-400">
    <div class="mb-2">
      <a href="#" class="hover:text-green-400 transition mx-2"></a>
    </div>
    <div>
      © 2025 <a href="#" class="hover:text-green-400 transition">{{ crate::util::AUTHOR }}</a>. All rights reserved.
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>

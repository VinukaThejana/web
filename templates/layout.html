<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title }} | Vinuka Kodituwakku {% endblock %}</title>

  <script src="/assets/js/tailwind.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"
    integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
    crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style type="text/tailwindcss">
    html {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
  </style>

  {% block head %}{% endblock %}
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <div class="container mx-auto px-4 max-w-3xl flex-grow">
    <!-- Navigation -->
    <nav class="py-6 flex justify-center">
      <div class="flex space-x-8 text-sm">
        <a href="#" class="hover:text-green-400 transition">Home</a>
        <a href="#" class="hover:text-green-400 transition">Newsletters</a>
        <a href="#" class="hover:text-green-400 transition">Projects</a>
        <a href="#" class="hover:text-green-400 transition">About</a>
      </div>
    </nav>

    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer class="py-8 text-center text-sm text-gray-400">
      <div class="mb-2">
        <a href="#" class="hover:text-green-400 transition mx-2">Newsletters</a>
        <a href="#" class="hover:text-green-400 transition mx-2">Consulting</a>
      </div>
      <div>
        © 2025 <a href="#" class="hover:text-green-400 transition">Vinuka Kodituwakku</a>. All rights reserved.
      </div>
    </footer>
</body>

</html>

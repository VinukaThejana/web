<title>{% block title %}{{ title }}{% endblock %} | Backend Development &amp; System Design </title>

<meta name="description"
  content="Notes and insights on backend systems, architecture patterns, and technical solutions from Vinuka Kodituwakku. Practical approaches to real challenges in backend development.">
<meta name="author" content="{{ crate::util::AUTHOR }}">
<meta name="keywords"
  content="backend development, system design, architecture patterns, technical solutions, software engineering, backend systems, rust, golang, vinuka kodituwakku">

<!-- Open Graph / Facebook -->
<meta property="og:title" content="{{ title }} | Backend Development & System Design">
<meta property="og:type" content="website">
<meta property="og:url" content="vinuka.dev">
<meta property="og:description"
  content="Notes and insights on backend systems, architecture patterns, and technical solutions from Vinuka Kodituwakku. Practical approaches to real challenges in backend development.">
<meta property="og:image" content="https://vinuka.dev/assets/images/profile.png">

<!-- Twitter -->
<meta property="twitter:title"
  content="{{ title }} | Backend Development & System Design">
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://vinuka.dev">
<meta property="twitter:description"
  content="Notes and insights on backend systems, architecture patterns, and technical solutions from Vinuka Kodituwakku. Practical approaches to real challenges in backend development.">
<meta property="twitter:image" content="https://vinuka.dev/assets/images/profile.png">

<!-- Technical SEO -->
<meta name="robots" content="index, follow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="language" content="English">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<!-- Schema.org markup for Google -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "headline": "{{ title }}",
    "description": "Notes and insights on backend systems, architecture patterns, and technical solutions from Vinuka Kodituwakku.",
    "author": {
      "@type": "Person",
      "name": "Vinuka Kodituwakku",
      "jobTitle": "Backend Developer",
      "url": "https://vinuka.dev"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://vinuka.dev"
    }
  }
</script>

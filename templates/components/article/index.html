<article id="{{ post.id }}" class="mb-8 bg-gray-800 p-6 rounded-lg">
  <h3 class="text-xl font-bold mb-1">
    <a href="/posts/{{ post.slug }}" class="hover:text-green-400 transition">{{ post.title }}</a>
  </h3>
  <p class="text-sm text-gray-400 mb-3">{{ post.date }}</p>
  <p class="text-gray-400 mb-3">
    {{ post.description }}
  </p>
  <div class="mb-3">
    {% for tag in post.tags %}
    <span class="text-xs bg-gray-700 px-2 py-1 rounded mr-2">
      #{{ tag }}
    </span>
    {% endfor %}
  </div>
  <a href="/posts/{{ post.slug }}" class="text-sm text-green-400 hover:underline">Read article →</a>
</article>

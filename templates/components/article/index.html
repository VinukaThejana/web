<article id="{{ post.id }}"
  class="mb-8 bg-gray-800 p-6 rounded-lg border border-gray-700 hover:border-gray-600 transition-all">
  <!-- Article Header with better mobile layout -->
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-2 mb-3">
    <h3 class="text-xl font-bold">
      <a href="/posts/{{ post.slug }}"
        class="text-gray-100 hover:text-green-400 transition group flex items-center flex-wrap">
        <span class="text-[#ff79c6]/80 font mr-1.5 hidden sm:inline">fn </span>{{ post.title }}
        <span
          class="text-gray-500 opacity-0 group-hover:opacity-100 transition-opacity ml-1 font-[JetBrains_Mono] hidden sm:inline">()</span>
      </a>
    </h3>
    <div
      class="text-xs bg-gray-700 px-2 py-1 rounded-full text-gray-300 font-[JetBrains_Mono] whitespace-nowrap flex-shrink-0 self-start">
      #[{{ post.date }}]
    </div>
  </div>

  <!-- Article Description with Rust-style comments -->
  <div class="mb-4">
    <p class="text-gray-400 mb-0">
      <span class="text-[#6272a4] font-[JetBrains_Mono] hidden sm:inline">/// </span>{{ post.description }}
    </p>
  </div>

  <!-- Tags as Rust attributes with better wrapping -->
  <div class="flex flex-wrap gap-y-2 mb-4">
    {% for tag in post.tags %}
    <span class="text-xs bg-gray-900 px-2 py-1 rounded mr-2 text-gray-300 font-[JetBrains_Mono]">
      <span class="text-[#ff79c6]/70">#[derive(</span><span class="text-[#50fa7b]/80">{{ tag }}</span><span
        class="text-[#ff79c6]/70">)]</span>
    </span>
    {% endfor %}
  </div>

  <!-- Read more link with Rust-inspired syntax -->
  <a href="/posts/{{ post.slug }}"
    class="inline-flex items-center text-sm font-[JetBrains_Mono] text-gray-400 hover:text-green-400 transition group">
    <span class="text-[#ff79c6]/80 inline">Post</span><span class="text-gray-500 inline">::</span><span
      class="text-[#50fa7b]/80">read_more</span><span class="text-gray-500">()</span>
    <svg xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4 ml-1 transform group-hover:translate-x-1 transition-transform" viewBox="0 0 20 20"
      fill="currentColor">
      <path fill-rule="evenodd"
        d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z"
        clip-rule="evenodd" />
    </svg>
  </a>
</article>

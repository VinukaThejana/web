<div class="p-6 bg-gray-800 rounded-lg border border-[#44475a] text-center">
  <div class="mb-6 inline-flex items-center justify-center w-16 h-16 bg-gray-900 rounded-full">
    <i class="fa-solid fa-exclamation-circle text-green-400 text-2xl"></i>
  </div>
  <h3 class="text-xl font-bold mb-2"><span class="text-green-400">Message</span> Failed</h3>
  <p class="text-gray-300 mb-6">
    Sorry, there was a problem sending your message. Please try again later.
  </p>
  <div class="mt-4 flex items-center justify-center p-3 bg-black rounded-md">
    <span class="inline-flex items-center justify-center w-6 h-6 bg-red-500 rounded-full mr-2">
      <i class="fa-solid fa-times text-white text-xs"></i>
    </span>
    <span class="text-white text-sm">Failed</span>
    <span class="ml-auto">
      {% include "icons/cloudflare.html" %}
    </span>
  </div>
</div>

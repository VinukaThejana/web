<div class="p-5 bg-gray-800 rounded-lg border border-[#44475a] transition hover:shadow-md">
  <h3 class="text-xl font-bold mb-2 text-gray-300"><span class="text-green-400">{{ project.title }}</span></h3>
  <p class="text-gray-300 text-sm mb-3 leading-relaxed">
    {{ project.description }}
  </p>
  <div class="flex flex-wrap gap-2 mb-3">
    {% for tag in project.tags %}
    <span class="px-2 py-1 bg-[#44475a] rounded-sm text-xs text-gray-300">{{ tag }}</span>
    {% endfor %}
  </div>
  <div class="flex items-center text-xs text-[#ff79c6]">
    <i class="fa-regular fa-calendar mr-1"></i>
    <span>{{ project.date }}</span>
  </div>
</div>

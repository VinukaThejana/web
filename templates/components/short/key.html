<div hx-target="this" hx-swap="outerHTML">
  <label for="key" class="block text-sm font-medium text-gray-300 mb-1 font-[JetBrains_Mono]">
    <span class="text-[#ff79c6]/80">key</span>: <span class="text-[#50fa7b]/80">String</span>
  </label>
  <style>
    .input-group {
      border-radius: 0.375rem;
      /* rounded-md */
    }

    .input-group:focus-within {
      outline: 2px solid #4ade80;
      /* exact Tailwind green-400 */
      outline-offset: 0;
    }

    #key {
      border-radius: 0;
      border-right: none;
    }

    #spinner-section {
      border-radius: 0;
      border-left: none;
    }
  </style>
  <div class="w-full flex items-center input-group bg-gray-700 border border-[#44475a]">
    <input type="text" id="key" name="key" required placeholder="my-short-link" hx-post="/api/components/short/verify"
      hx-indicator="#key-spinner" value="{{ value }}"
      class="w-full px-3 py-2 bg-gray-700 text-gray-300 focus:outline-none font-[JetBrains_Mono]">
    <section id="spinner-section" class="px-3 py-2 bg-gray-700 z-50">
      <i id="key-spinner" class="htmx-indicator fa-solid fa-spinner animate-spin text-gray-400 text-xs"></i>
    </section>
  </div>

  {% if message_type == "info" %}
  <p class="text-xs text-gray-400 mt-1">{{ message }}</p>
  {% else %}
  <p class="text-xs text-gray-400 mt-1 error-message">{{ message }}</p>
  {% endif %}
</div>

{% extends "layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block head %}
<meta name="description" content="{{ summary }}">
<meta name="keywords" content="{{ keywords }}">
<meta name="author" content="{{ crate::util::AUTHOR }}">
<meta name="robots" content="index, follow">

<meta property="og:type" content="article">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ summary }}">
<meta property="og:image" content="{{ image_url }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:site_name" content="{{ crate::util::AUTHOR }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ summary }}">
<meta name="twitter:image" content="{{ image_url }}">
<meta name="twitter:creator" content="{{ crate::util::AUTHOR_TWITTER }}">

<link rel="canonical" href="{{ url }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ title }}",
  "alternativeHeadline": "{{ title }}",
  "image": [
    "{{ image_url }}"
  ],
  "author": {
    "@type": "Person",
    "name": "{{ crate::util::AUTHOR }}",
    "url": "{{ crate::util::AUTHOR_GITHUB }}"
  },
  "url": "{{ url }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ url }}"
  },
  "datePublished": "{{ date }}",
  "dateModified": "{{ date }}",
  "description": "{{ date }}",
  "keywords": "{{ keywords }}",
  "genre": "{{ keywords }}",
  "wordcount": {{ word_count }}
}
</script>

<link rel="stylesheet" href="/assets/css/post.min.css">
<link rel="stylesheet" href="/assets/css/dracula.min.css">
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="content-wrapper">
    <div class="main-content prose prose-lg min-h-screen">
      <div class="article-metadata">
        <span class="article-date">{{ date }}</span>
      </div>

      {{ content | safe }}
    </div>
    
    <div class="toc-container" id="toc">
      <div class="toc-title">
        Contents
      </div>
      <ul class="toc-list" id="toc-list">
      </ul>
    </div>
  </div>
</div>

{% call super() %}
{% endblock %}

{% block scripts %}
<script src="/assets/js/highlight/highlight.min.js"></script>
<script src="/assets/js/highlight/languages/go.min.js"></script>
<script src="/assets/js/highlight/languages/rust.min.js"></script>
<script src="/assets/js/highlight/languages/protobuf.min.js"></script>
<script src="/assets/js/highlight/languages/bash.min.js"></script>
<script src="/assets/js/highlight/languages/typescript.min.js"></script>
<script>
  hljs.highlightAll();
  
  document.addEventListener('DOMContentLoaded', function() {
    const tocList = document.getElementById('toc-list');
    const headings = document.querySelectorAll('.prose h2, .prose h3');
    const mainContent = document.querySelector('.main-content');
    
    if (headings.length === 0 || !tocList) return;
    
    headings.forEach((heading, index) => {
      if (!heading.id) {
        const headingText = heading.textContent.trim();
        heading.id = headingText
          .toLowerCase()
          .replace(/[^\w\s-]/g, '')
          .replace(/\s+/g, '-');
        heading.id += `-${index}`;
      }
      
      const listItem = document.createElement('li');
      const link = document.createElement('a');
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent.trim();
      link.setAttribute('data-heading-id', heading.id);
      
      if (heading.tagName.toLowerCase() === 'h3') {
        link.classList.add('toc-h3');
      }
      
      listItem.appendChild(link);
      tocList.appendChild(listItem);
    });
    
    const tocLinks = document.querySelectorAll('.toc-list a');
    
    const highlightTocOnScroll = () => {
      const scrollPos = window.scrollY + 100;
      let currentHeadingId = null;
      
      headings.forEach(heading => {
        const headingTop = heading.getBoundingClientRect().top + window.scrollY;
        
        if (headingTop <= scrollPos) {
          currentHeadingId = heading.id;
        }
      });
      
      tocLinks.forEach(link => {
        link.classList.remove('active');
      });
      
      if (currentHeadingId) {
        const activeLink = document.querySelector(`.toc-list a[data-heading-id="${currentHeadingId}"]`);
        if (activeLink) {
          activeLink.classList.add('active');
        }
      }
    };
    
    tocLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = link.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);
        
        if (targetElement) {
          window.scrollTo({
            top: targetElement.offsetTop - 20,
            behavior: 'smooth'
          });
          
          history.pushState(null, null, `#${targetId}`);
          
          tocLinks.forEach(l => l.classList.remove('active'));
          link.classList.add('active');
        }
      });
    });
    
    window.addEventListener('scroll', highlightTocOnScroll);
    
    highlightTocOnScroll();
    
    const codeBlocks = document.querySelectorAll('pre code');
    
    codeBlocks.forEach((codeBlock, index) => {
      const pre = codeBlock.parentElement;
      
      const copyButton = document.createElement('button');
      copyButton.className = 'copy-button';
      copyButton.setAttribute('aria-label', 'Copy code');
      copyButton.setAttribute('data-index', index);
      
      copyButton.innerHTML = `
        <svg class="copy-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Copy</span>
      `;
      
      pre.appendChild(copyButton);
      
      copyButton.addEventListener('click', () => {
        const code = codeBlock.textContent;
        
        navigator.clipboard.writeText(code).then(() => {
          copyButton.classList.add('copied');
          copyButton.querySelector('span').textContent = 'Copied!';
          
          setTimeout(() => {
            copyButton.classList.remove('copied');
            copyButton.querySelector('span').textContent = 'Copy';
          }, 2000);
        }).catch(err => {
          console.error('Failed to copy code: ', err);
          copyButton.querySelector('span').textContent = 'Failed';
          
          setTimeout(() => {
            copyButton.querySelector('span').textContent = 'Copy';
          }, 2000);
        });
      });
    });
  });
</script>
{% endblock %}

[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
axum = "0.8.3"
base64 = "0.22.1"
dotenvy = "0.15.7"
envmode = "0.1.3"
envy = "0.4.2"
fern = { version = "0.7.1", features = ["colored"] }

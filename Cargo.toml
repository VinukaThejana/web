[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
entity = { path = "entity" }
migration = { path = "migration" }

anyhow = "1.0.97"
askama = "0.13.0"
axum = "0.8.3"
base64 = "0.22.1"
chrono = "0.4.40"
dotenvy = "0.15.7"
envmode = "0.1.3"
envy = "0.4.2"
fern = { version = "0.7.1", features = ["colored"] }
highlight-pulldown = "0.2.2"
humantime = "2.2.0"
log = { version = "0.4.27", features = ["std", "serde"] }
once_cell = "1.21.3"
pulldown-cmark = "0.13.0"
redis = { version = "0.29.5", features = [
  "tokio-comp",
  "tokio-native-tls-comp",
] }
resend-rs = "0.12.1"
sea-orm = { version = "1.1.8", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "macros",
] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full", "macros", "rt-multi-thread"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["full"] }
validator = { version = "0.20.0", features = ["derive"] }
words-count = "0.1.6"
phf = { version = "0.11.3", features = ["macros"] }
tower_governor = { version = "0.7.0", features = ["axum", "tracing"] }
reqwest = { version = "0.12.15", features = [
  "json",
  "multipart",
  "rustls-tls",
] }
ulid = "1.2.1"
governor = "0.8.1"

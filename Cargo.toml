[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["."]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]

anyhow = "1.0.97"
askama = "0.13.0"
axum = "0.8.3"
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["serde"] }
dotenvy = "0.15.7"
envmode = "0.1.3"
envy = "0.4.2"
fern = { version = "0.7.1", features = ["colored"] }
highlight-pulldown = "0.2.2"
humantime = "2.2.0"
log = { version = "0.4.27", features = ["std", "serde"] }
pulldown-cmark = "0.13.0"
redis = { version = "0.29.5", features = ["tokio-comp", "tokio-rustls-comp"] }
resend-rs = "0.12.1"
sqlx = { version = "0.8.3", features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "timeout", "cors", "fs"] }
validator = { version = "0.20.0", features = ["derive"] }
words-count = "0.1.6"
phf = { version = "0.13.1", features = ["macros"] }
tower_governor = { version = "0.7.0", features = ["axum", "tracing"] }
reqwest = { version = "0.13.3", features = [
  "json",
  "multipart",
  "rustls",
  "cookies",
  "form",
] }
ulid = "1.2.1"
governor = "0.8.1"
aws-sdk-s3 = { version = "1.82.0", features = ["rustls"] }
aws-config = { version = "1.1.7", features = [
  "behavior-version-latest",
  "rustls",
] }
sha1 = "0.11.0"
hex = "0.4.3"
aws-smithy-types = "1.3.0"
base64-url = "3.0.0"
lol_html = "2.5.0"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
regex = "1.12.2"
urlencoding = "2.1.3"
url = "2.5.8"
scraper = "0.27.0"
lambda_http = "1.1.3"
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
openssl = { version = "0.10", features = ["vendored"] }
hmac = "0.13.0"
sha2 = "0.11.0"
